[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-agent"
version = "0.2.1"
description = "Autonomous research agent: typed questions in, cited answers out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Satwik Cheppala" }]
keywords = ["agent", "research", "gemini", "tavily", "search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "google-genai>=1.14.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tavily-python>=0.5.0",
    "youtube-transcript-api>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
memento = "memento_agent.cli:main"

[project.urls]
Homepage = "https://github.com/SATWIK-1CH/memento_agent"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memento_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live: hits real Gemini + Tavily; skipped unless GEMINI_API_KEY and TAVILY_API_KEY are set",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
